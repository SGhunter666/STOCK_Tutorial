<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stock Market Academy · 股票市场学院</title>
  <meta name="description" content="Bilingual financial education and stock trading simulator. Virtual companies, virtual money, real concepts.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1421'/%3E%3Cpath d='M16 40l10-10 8 8 14-16' stroke='%235eead4' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/academy.css">
  <link rel="stylesheet" href="./css/views.css">
  <link rel="stylesheet" href="./css/history.css">
</head>
<body>
  <div id="protocol-warning" class="protocol-warning" hidden>
    <strong>请通过本地服务器运行 / Run with a local server</strong>
    <span>浏览器禁止 <code>file://</code> 加载 ES Modules 与语言文件。请运行 <code>python3 -m http.server 8000</code> 后访问 <code>http://localhost:8000</code>。</span>
  </div>
  <div id="app">
    <div class="boot-splash">
      <span class="boot-mark">SMA</span>
      <span class="spinner"></span>
    </div>
  </div>
  <div id="toast-layer" class="toast-layer" aria-live="polite"></div>
  <div id="modal-root" class="modal-root"></div>
  <noscript>
    <div class="protocol-warning">
      <strong>需要启用 JavaScript / JavaScript is required</strong>
      <span>Stock Market Academy 是一款在浏览器本地运行的教学游戏。</span>
    </div>
  </noscript>
  <script>
    if (location.protocol === 'file:') {
      var warning = document.getElementById('protocol-warning');
      if (warning) warning.hidden = false;
    }
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
